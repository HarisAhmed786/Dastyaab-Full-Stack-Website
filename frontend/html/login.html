<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Dastyaab</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />

</head>
<body>
  <nav>
    <a href="index.html" class="logo">Dasty<span>aab</span></a>
    <a href="index.html" class="nav-back">← Back to Home</a>
  </nav>

  <div class="auth-layout">
    <div class="auth-visual">
      <div class="visual-tag">Welcome Back</div>
      <h2 class="visual-title">Good to See<br>You Again.</h2>
      <p class="visual-desc">Log in to access your account, manage bookings, and discover trusted local professionals.</p>
      <div class="quote">
       <div class="quote-text">"Find the Right Expert for Every Job"</div>
        <div class="quote-author">— From Dastyaab</div>
      </div>
    </div>

    <div class="auth-panel">
      <div class="form-tag">Sign In</div>
      <h1 class="form-title">Welcome Back</h1>
      <p class="form-sub">Don't have an account? <a href="register.html">Register here</a></p>

      <div id="msg" class="msg"></div>

      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" />
      </div>

      <button class="btn-submit" onclick="login()">Sign In →</button>
    </div>
  </div>
  
  <!-- JavaScript -->
 <script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = `msg ${type}`;
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showMsg('Please enter your email and password.', 'error');
      return;
    }

    try {
      const data = await window.api.post('/login', { email, password });

      // Store the JWT — this is what proves identity to the backend from
      // now on. userId/userName/userRole are kept too, purely for quick
      // UI display; the backend never trusts them, only the token.
      localStorage.setItem("token", data.token);
      localStorage.setItem("userId", data.user._id);
      localStorage.setItem("userName", data.user.name);
      localStorage.setItem("userRole", data.user.role);

      showMsg('✓ Login successful! Redirecting…', 'success');

      setTimeout(() => {
        if (data.user.role === 'provider') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'search.html';
        }
      }, 1500);

    } catch (err) {
      showMsg(err.message || 'Invalid credentials.', 'error');
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
